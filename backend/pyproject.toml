[project]
name = "underleaf-backend"
version = "0.1.0"
description = "Underleaf 后端：FastAPI + SQLAlchemy + MySQL + Redis"
requires-python = "==3.12.*"
dependencies = ["fastapi>=0.162.2", "uvicorn[standard]>=0.54.0", "sqlalchemy[asyncio]>=2.1.8", "aiomysql>=0.3.2", "cryptography>=50.0.2", "alembic>=1.20.1", "pydantic-settings>=2.16.2", "pydantic[email]>=2.14.3", "redis>=8.1.0", "pwdlib[argon2]>=0.3.1", "pyjwt>=2.15.1", "aiosmtplib>=5.1.3", "playwright>=1.64.1", "pypandoc-binary>=1.17", "httpx>=0.28.1", "dulwich>=1.2.21"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "uvicorn app.main:app --reload --port 8000"
migrate = "alembic upgrade head"
lint = { composite = ["ruff check .", "ruff format --check .", "pyright"] }
format = { composite = ["ruff check --fix .", "ruff format ."] }
test = "pytest"
tunnel = "bash scripts/tunnel.sh"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文标点出现在字符串和注释中

[tool.ruff.lint.per-file-ignores]
# 手动执行的运维脚本，同步文件操作不影响服务
"scripts/*" = ["ASYNC240"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
]
